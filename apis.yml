name: Propseller
description: 'Propseller is a Singapore-based, technology-powered real estate brokerage founded in
  2018 by Adrien Jorge. It helps property owners sell, buy, and rent residential real estate — HDB
  flats, condominiums, and landed homes — pairing top-performing human property agents with data and
  technology to deliver an end-to-end transaction experience at a transparent commission starting from
  1%. Backed by Vertex Ventures and Partech, Propseller operates a consumer-facing real estate service
  and does not currently publish a public developer API, SDK, or programmatic integration surface.'
